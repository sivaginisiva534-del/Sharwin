<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday Sharwin! 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { 
  background: linear-gradient(pink, #ffdde1);
  text-align: center; 
  font-family: Arial; 
  margin:0;
  padding:20px;
}
h1 { color: #ff1493; font-size: 40px; animation: bounce 1s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  max-width: 500px;
  margin: 20px auto;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}
img { width: 90%; border-radius: 15px; margin-top:10px; }
p { font-size: 18px; color: #333; }
button {
  background: #ff1493;
  color: white;
  border: none;
  padding: 15px 25px;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
  margin-top: 15px;
}
</style>
</head>
<body>

<h1>🎉 Happy Birthday Sharwin! 🎂</h1>

<div class="card">
  <img src="Sharwin.png" alt="Sharwin Photo">
  <h2>En Chellam Sharwin 😍</h2>
  <p>
    En uyire Sharwin! <br>
    Nee thaan en ulagam! <br>
    Amma unna romba love panren! ❤️
  </p>
  <button onclick="alert('Amma unna romba love panren Sharwin! ❤️🎂')">Click pannu Sharwin! 🎁</button>
</div>

<div class="card">
  <h2>🎈 En Vazhthu 🎈</h2>
  <p>
    Sharwin kutty nalla padikanum,<br>
    Nalla periya aal aaganum,<br>
    Amma kooda eppovum santhosama irukanum!
  </p>
</div>

<p>Made with ❤️ by Amma SIVAGINI</p>

</body>
</html>
